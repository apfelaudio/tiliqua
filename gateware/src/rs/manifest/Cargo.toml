[package]
name = "tiliqua-manifest"
version = "0.1.0"
edition = "2021"

[lib]
name = "tiliqua_manifest"
path = "src/lib.rs"

[dependencies]
log = "0.4.17"
heapless = "0.9.3"
strum_macros = "0.28.0"
strum = {version = "0.28.0", features = ["derive"], default-features=false}
micromath = "2.1.0"
fixed = "1.28.0"
serde-json-core = "0.7.0"
serde = { version="1.0.214", default-features=false }

[dev-dependencies]
critical-section = { version = "1.1.2", features = ["std"] }
env_logger = "0.11.6"

[lints]
workspace = true
